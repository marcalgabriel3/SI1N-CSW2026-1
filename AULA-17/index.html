<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Calculador de Idade</title>
</head>

<body>
    <div class="folha">
        <div class="fundo_div">
                <div id="imagem">
                    <h1>Calculadora de Idade</h1>
                </div>
        </div>
        <label for="">Data de Nascimento:</label>
        <input type="number" id="dia" name="dia" min="1" max="31" placeholder="Dia">
        <select name="mês" size="1">
            <option value="01">Janeiro</option>
            <option value="02">Fevereiro</option>
            <option value="03">Março</option>
            <option value="04">Abril</option>
            <option value="05">Maio</option>
            <option value="06">Junho</option>
            <option value="07">Julho</option>
            <option value="08">Agosto</option>
            <option value="09">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
        </select>
        <input type="number" id="ano" name="ano" min="1900" max="2027" placeholder="Ano">
        <button onclick="calcularidade()">Calcular Idade</button>
        <div class="respostaidade">
            <p>Idade:</p>
        </div>
        <hr>
        <div class="fundo_div">
            <div class="calculadora">
                <p>Calculadora</p>
            </div>
        </div>
        <input type="" id="n1" name="n1">
        <select name="sinal" size="1">
            <option value="soma"> + </option>
            <option value="subtração"> - </option>
            <option value="multiplicação"> * </option>
            <option value="divisão"> : </option>
        </select>
        <input type="" id="n2" name="n2">
        <button onclick="calcular()">Calcular</button>
        <div class="respostacal">
            <p>Resposta:</p>
        </div>
    </div>
 <script src="script.js"></script>




</body>

</html>
